<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Modulyt · Object Tracker</title>
  <link rel="stylesheet" href="/static/modulyt.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Modulyt</a>
    <span class="title">Object Tracker</span>
    <span class="spacer"></span>
    <span id="live" class="live" title="Live connection to the server">live</span>
    <button id="import" title="Import objects from an Excel workbook (one sheet per type)">Import Excel</button>
    <button id="add-type" title="Create a new object type">+ Type</button>
    <button id="add-object" class="primary">+ New</button>
  </header>

  <div class="toolbar">
    <select id="type-filter" aria-label="Filter by type"></select>
    <button id="edit-type" title="Edit the selected type and its status list" hidden>Edit type</button>
    <select id="status-filter" aria-label="Filter by status"></select>
    <input id="text-filter" type="search" placeholder="Filter by ID, title, author, status, notes, tag…" autocomplete="off">
    <span class="badge" id="count"></span>
    <button id="clear" title="Clear all filters">Clear filters</button>
  </div>
  <div id="tags" class="tagbar"></div>

  <main class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="ref">ID / Name</th>
          <th data-sort="type">Type</th>
          <th data-sort="status">Status</th>
          <th data-sort="author">Author</th>
          <th>Tags</th>
          <th>Notes</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script src="/static/modulyt.js"></script>
  <script src="app.js"></script>
</body>
</html>
